; Export presets for the SkyRoads port.
;
; Two mobile targets. Neither can be built until the matching export
; templates for this Godot version are installed, and neither is signed
; here — the Android keystore and the iOS team id are the developer's, not
; the repository's, and putting either in a tracked file is how signing keys
; leak.
;
;   Android release, from this directory:
;     godot --headless --export-release "Android" \
;         ../build/10000-1.0.0-release.aab
;   with the keystore supplied out of band:
;     export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=~/keys/skyroads.keystore
;     export GODOT_ANDROID_KEYSTORE_RELEASE_USER=upload
;     export GODOT_ANDROID_KEYSTORE_RELEASE_PASS=...
;
; The output name is <versionCode>-<versionName>-<buildType> on purpose:
; Gradle's default name is identical for every build ever made, and the one
; thing that must be right at upload — the version code, which may only
; increase — is the one thing that name does not carry.
;
; The exclude list is everything the shipped game never opens: `tests/` and
; `docs/` (5 MB of goldens and parity captures), the fourteen OPL2 event
; streams in `data/music/song_NN.json` (2.9 MB — the SOURCE the .ogg renders
; were made from, kept in the repo as the record of the format but read by
; nothing at runtime; only `music_meta.json` is), and the golden traces under
; `data/routes/` that only `test_physics` reads.

